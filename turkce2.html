<!DOCTYPE html>
<html lang="tr">

    <style>

            margin: 0;

            text-align: center;
            padding: 35px;
        }

        .konular {
            max-width: 800px;

        }

            color: #3157d5;
        }

        button {
            background: #3157d5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

</head>
